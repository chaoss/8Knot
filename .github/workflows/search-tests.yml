name: Search regression tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: search-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install application dependencies
        run: uv sync --frozen
      - name: Test search SQL, synchronization, and selection callbacks
        run: uv run --no-sync python scripts/ci/search_test.py -v
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: search-test
